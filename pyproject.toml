[project]
name = "tokentax"
version = "2.0.0"
description = "Measure, explain, predict and cut the token tax that South Asian languages pay to LLMs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Team BNKV" }]
dependencies = [
    "tokenizers>=0.19",
    "regex>=2023.0",
    "numpy>=1.24",
    "indic-transliteration>=2.3",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "qrcode>=7.4",
]

[project.optional-dependencies]
meaning = ["sentence-transformers>=2.6"]
dev = ["pytest>=8", "httpx>=0.27", "mypy>=1.10", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src/tokentax", "app"]

[[tool.mypy.overrides]]
module = ["indic_transliteration.*", "sentence_transformers.*", "regex.*", "qrcode.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
